name: Refresh Telegram previews

# After a push that adds or edits posts, wait for both sites to serve the new content,
# then ask @WebpageBot to re-fetch those URLs. This clears Telegram's cached
# "no preview" for links shared before a post existed, and stale cards after edits.
on:
  push:
    branches: [main]
    paths: ['public/content/**']
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Post slugs to refresh (space-separated). Leave empty for all posts.'
        required: false

concurrency:
  group: telegram-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: changed
        name: Find added or changed posts
        env:
          INPUT_SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          if [ -n "$INPUT_SLUGS" ]; then
            slugs=$(echo "$INPUT_SLUGS" | tr -cd 'a-z0-9_ -')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slugs=$(ls public/content/posts/*.json | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          elif git diff --name-only HEAD~1 HEAD -- public/content/site.json | grep -q .; then
            # Site-wide change (name, branding): every card changes.
            slugs=$(ls public/content/posts/*.json | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          else
            slugs=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD -- 'public/content/posts/*.json' | xargs -rn1 basename | sed 's/\.json$//' | grep -v '^_' | tr '\n' ' ')
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Posts: ${slugs:-none}"
      - name: Ask @WebpageBot to refresh
        if: steps.changed.outputs.slugs != ''
        env:
          LINK_URL: ${{ vars.SHARE_BASE_URL || 'https://syndica-link.vercel.app' }}
          WEB_URL: ${{ vars.WEB_URL || 'https://syndica-web.vercel.app' }}
          LINK_REVALIDATE_SECRET: ${{ secrets.LINK_REVALIDATE_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: node scripts/telegram-refresh.mjs ${{ steps.changed.outputs.slugs }}
